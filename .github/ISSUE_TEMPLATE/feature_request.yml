name: Feature request
description: Suggest an improvement for Pokelet
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Pokelet to do?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Why would this be useful?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: How might it work?
      description: Examples or screenshots are welcome.
