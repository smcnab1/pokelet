name: macOS build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record the toolchain
        id: toolchain
        run: |
          git log -1 --format='Checked-out source %H (parents %P)'
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.swift', 'Pokelet/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-
      - name: Analyse Swift source with SwiftLint
        run: ./script/lint_swift.sh
      - name: Check source and test
        run: |
          git diff --check "HEAD^" HEAD
          python3 script/check_docs.py
          ruby script/check_issue_forms.rb
          for script in script/*.sh packaging/dmg/*.sh; do bash -n "$script"; done
          swift test -Xswiftc -warnings-as-errors
          ./script/test_studio_layout.sh
      - name: Build and analyse Debug
        run: |
          xcodebuild -quiet -project Pokelet.xcodeproj -scheme Pokelet -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath build/debug \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build analyze
      - name: Validate the universal Release archive
        run: |
          ./script/package_release.sh
          ./script/package_dmg.sh --check-layout dist/candidate/Pokelet.app
      - name: Analyse universal Release
        run: |
          xcodebuild -quiet -project Pokelet.xcodeproj -scheme Pokelet -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/release \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO analyze
      - name: Verify the generated app metadata
        run: |
          verify_metadata() {
            local configuration="$1" plist="$2/Contents/Info.plist" settings version build
            settings=$(xcodebuild -project Pokelet.xcodeproj -scheme Pokelet -configuration "$configuration" \
              -destination 'generic/platform=macOS' -showBuildSettings -json)
            version=$(plutil -extract 0.buildSettings.MARKETING_VERSION raw - <<< "$settings")
            build=$(plutil -extract 0.buildSettings.CURRENT_PROJECT_VERSION raw - <<< "$settings")
            test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$version"
            test "$(plutil -extract CFBundleVersion raw "$plist")" = "$build"
            printf 'Verified %s app metadata %s (%s)\n' "$configuration" "$version" "$build"
          }
          verify_metadata Debug build/debug/Build/Products/Debug/Pokelet.app
          verify_metadata Release dist/candidate/Pokelet.app
      - name: Retain the ad hoc candidate for manual testing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pokelet-ad-hoc-${{ github.sha }}
          path: |
            dist/candidate/Pokelet.zip
            dist/candidate/Pokelet.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
